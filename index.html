<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A Poem for You, Each Day</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="bg" id="bg" aria-hidden="true"></div>
  <div class="bg__veil" aria-hidden="true"></div>
  <div class="petals" aria-hidden="true"></div>

  <main class="card" id="card">
    <header class="card__head">
      <p class="card__date" id="date"></p>
      <h1 class="card__brand">A poem for you</h1>
    </header>

    <article class="poem" id="poem" aria-live="polite">
      <h2 class="poem__title" id="poem-title"></h2>
      <div class="poem__body" id="poem-body"></div>
      <p class="poem__author" id="poem-author"></p>
    </article>

    <footer class="card__foot">
      <button class="btn btn--round" id="prev" aria-label="Previous poem">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M15 5l-7 7 7 7" />
        </svg>
      </button>
      <button class="btn btn--ghost" id="today">Today</button>
      <button class="btn btn--round" id="next" aria-label="Next poem">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 5l7 7-7 7" />
        </svg>
      </button>
    </footer>

    <section class="anniv" id="anniv" aria-live="polite"></section>

    <button class="love-inline" id="love" type="button">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
      </svg>
      <span>send a little love back</span>
    </button>
  </main>

  <p class="sign">made with love, every day</p>

  <div class="modal" id="modal" aria-hidden="true">
    <div class="modal__backdrop" data-close></div>
    <div class="modal__card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal__hearts" id="modal-hearts" aria-hidden="true"></div>
      <p class="modal__eyebrow" id="modal-eyebrow"></p>
      <h2 class="modal__title" id="modal-title"></h2>
      <p class="modal__sub" id="modal-sub"></p>
      <button class="btn btn--ghost" id="modal-close" data-close>with love &#9825;</button>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
